services:
  finanpy:
    image: easypanel/financeiro/finanpy:latest
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/db.sqlite3}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
    ports:
      - target: 8020
        published: 8020
        protocol: tcp
        mode: host
      - target: 8020
        published: 8020
        protocol: udp
        mode: host
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
    networks:
      - easypanel
      - easypanel-financeiro
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py check --deploy &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8020 --workers 2"
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure

volumes:
  sqlite_data:
  media_data:

networks:
  easypanel:
    external: true
  easypanel-financeiro:
    external: true
