{
  "openapi": "3.1.0",
  "info": {
    "title": "Lar Finance Private API",
    "version": "1.0.0"
  },
  "servers": [{"url": "/api/v1"}],
  "security": [{"opaqueBearer": []}],
  "paths": {
    "/health/": {
      "get": {
        "operationId": "health",
        "security": [],
        "responses": {
          "200": {
            "description": "API available",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": ["status", "api_version"],
                  "properties": {
                    "status": {"const": "ok"},
                    "api_version": {"const": "v1"}
                  }
                }
              }
            }
          },
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/auth/login/": {
      "post": {
        "operationId": "login",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/LoginRequest"}
            }
          }
        },
        "responses": {
          "200": {
            "description": "New device session",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/TokenPair"}
              }
            }
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "429": {"$ref": "#/components/responses/TooManyRequests"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/auth/refresh/": {
      "post": {
        "operationId": "refresh",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": ["refresh_token"],
                "properties": {
                  "refresh_token": {"type": "string"}
                },
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Rotated access and refresh tokens",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/TokenPair"}
              }
            }
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "429": {"$ref": "#/components/responses/TooManyRequests"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/auth/logout/": {
      "post": {
        "operationId": "logout",
        "security": [{"opaqueBearer": []}],
        "responses": {
          "204": {
            "description": "Current device session revoked",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}}
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/devices/": {
      "get": {
        "operationId": "listDevices",
        "security": [{"opaqueBearer": []}],
        "responses": {
          "200": {
            "description": "Device sessions belonging to the authenticated user and household",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {"$ref": "#/components/schemas/Device"}
                }
              }
            }
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/devices/current/": {
      "patch": {
        "operationId": "updateCurrentDevice",
        "security": [{"opaqueBearer": []}],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "name": {"type": "string", "maxLength": 80},
                  "default_owner_uuid": {"type": "string", "format": "uuid"}
                },
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated current device",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Device"}
              }
            }
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/devices/{device_uuid}/revoke/": {
      "parameters": [
        {
          "name": "device_uuid",
          "in": "path",
          "required": true,
          "schema": {"type": "string", "format": "uuid"}
        }
      ],
      "post": {
        "operationId": "revokeDevice",
        "security": [{"opaqueBearer": []}],
        "responses": {
          "204": {
            "description": "Owned device session revoked",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}}
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/household/": {
      "get": {
        "operationId": "getHousehold",
        "security": [{"opaqueBearer": []}],
        "responses": {
          "200": {
            "description": "Authenticated household",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Household"}
              }
            }
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/owners/": {
      "get": {
        "operationId": "listFinancialOwners",
        "security": [{"opaqueBearer": []}],
        "responses": {
          "200": {
            "description": "Financial owners in the authenticated household",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {"$ref": "#/components/schemas/FinancialOwner"}
                }
              }
            }
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/accounts/": {
      "get": {
        "operationId": "listAccounts",
        "security": [{"opaqueBearer": []}],
        "responses": {
          "200": {
            "description": "Accounts in the authenticated household",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {"$ref": "#/components/schemas/Account"}
                }
              }
            }
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/categories/": {
      "get": {
        "operationId": "listCategories",
        "security": [{"opaqueBearer": []}],
        "responses": {
          "200": {
            "description": "Categories in the authenticated household",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {"$ref": "#/components/schemas/Category"}
                }
              }
            }
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/transactions/": {
      "get": {
        "operationId": "listTransactions",
        "security": [{"opaqueBearer": []}],
        "responses": {
          "200": {
            "description": "Transactions in the authenticated household",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {"$ref": "#/components/schemas/Transaction"}
                }
              }
            }
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/summary/": {
      "get": {
        "operationId": "getSummary",
        "security": [{"opaqueBearer": []}],
        "responses": {
          "200": {
            "description": "Household balance summary",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Summary"}
              }
            }
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/bootstrap/": {
      "get": {
        "operationId": "bootstrap",
        "security": [{"opaqueBearer": []}],
        "responses": {
          "200": {
            "description": "Complete household snapshot and initial delta cursor",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/Bootstrap"}
              }
            }
          },
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/sync/push/": {
      "post": {
        "operationId": "pushChanges",
        "security": [{"opaqueBearer": []}],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": ["operations"],
                "properties": {
                  "operations": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 100,
                    "items": {"$ref": "#/components/schemas/PushOperation"}
                  }
                },
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Ordered per-operation outcomes with confirmed state and version; this response never advances or returns a delta cursor",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": ["results"],
                  "properties": {
                    "results": {
                      "type": "array",
                      "items": {"$ref": "#/components/schemas/PushResult"}
                    }
                  }
                }
              }
            }
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/sync/changes/": {
      "get": {
        "operationId": "pullChanges",
        "security": [{"opaqueBearer": []}],
        "parameters": [
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {"type": "string"}
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {"type": "integer", "minimum": 0, "maximum": 100, "default": 100}
          }
        ],
        "responses": {
          "200": {
            "description": "Ordered changes after the cursor",
            "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/DeltaPage"}
              }
            }
          },
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/imports/ofx/preview/": {
      "post": {
        "operationId": "previewCompatibleOfx",
        "description": "Accepts BRL OFX structurally compatible with the tested Nubank profile. The profile label does not verify institutional origin.",
        "security": [{"opaqueBearer": []}],
        "requestBody": {"required": true, "content": {"multipart/form-data": {"schema": {"type": "object", "required": ["file"], "properties": {"file": {"type": "string", "format": "binary", "maxLength": 10485760}}, "additionalProperties": false}}}},
        "responses": {
          "201": {"description": "Private normalized import preview", "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ImportBatch"}}}},
          "400": {"$ref": "#/components/responses/BadRequest", "x-error-codes": ["invalid_ofx", "unsupported_ofx", "file_too_large", "invalid_import_state"]},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "503": {"$ref": "#/components/responses/ServiceUnavailable", "x-error-codes": ["import_temporarily_unavailable"]},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/imports/{batch_uuid}/": {
      "parameters": [{"name": "batch_uuid", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}],
      "get": {
        "operationId": "getImportPreview",
        "security": [{"opaqueBearer": []}],
        "responses": {
          "200": {"description": "Private normalized import preview", "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ImportBatch"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "503": {"$ref": "#/components/responses/ServiceUnavailable", "x-error-codes": ["import_temporarily_unavailable"]},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/imports/{batch_uuid}/bind-account/": {
      "parameters": [{"name": "batch_uuid", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}],
      "post": {
        "operationId": "bindImportAccount",
        "security": [{"opaqueBearer": []}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["account_uuid"], "properties": {"account_uuid": {"type": "string", "format": "uuid"}}, "additionalProperties": false}}}},
        "responses": {
          "200": {"description": "Preview linked to an account", "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ImportBatch"}}}},
          "400": {"$ref": "#/components/responses/BadRequest", "x-error-codes": ["invalid_import_state", "expired_import_preview"]},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "503": {"$ref": "#/components/responses/ServiceUnavailable", "x-error-codes": ["import_temporarily_unavailable"]},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/imports/{batch_uuid}/confirm/": {
      "parameters": [{"name": "batch_uuid", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}],
      "post": {
        "operationId": "confirmImportPreview",
        "security": [{"opaqueBearer": []}],
        "responses": {
          "200": {"description": "Confirmed import receipt", "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ImportBatch"}}}},
          "400": {"$ref": "#/components/responses/BadRequest", "x-error-codes": ["invalid_import_state", "expired_import_preview"]},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "503": {"$ref": "#/components/responses/ServiceUnavailable", "x-error-codes": ["import_temporarily_unavailable"]},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/imports/{batch_uuid}/cancel/": {
      "parameters": [{"name": "batch_uuid", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}],
      "post": {
        "operationId": "cancelImportPreview",
        "security": [{"opaqueBearer": []}],
        "responses": {
          "200": {"description": "Cancelled import receipt", "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ImportBatch"}}}},
          "400": {"$ref": "#/components/responses/BadRequest", "x-error-codes": ["invalid_import_state", "expired_import_preview"]},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "503": {"$ref": "#/components/responses/ServiceUnavailable", "x-error-codes": ["import_temporarily_unavailable"]},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    }
  },
  "components": {
    "headers": {
      "RequestId": {
        "description": "UUID used to correlate the request with its access log.",
        "schema": {"type": "string", "format": "uuid"}
      }
    },
    "securitySchemes": {
      "opaqueBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Opaque access token issued for one revocable device session."
      }
    },
    "responses": {
      "BadRequest": {
        "description": "Invalid request or cursor",
        "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorEnvelope"}}}
      },
      "Unauthorized": {
        "description": "Missing, invalid, expired, or revoked device credentials",
        "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorEnvelope"}}}
      },
      "Forbidden": {
        "description": "Authenticated session lacks permission",
        "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorEnvelope"}}}
      },
      "NotFound": {
        "description": "Resource not found inside the authenticated scope",
        "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorEnvelope"}}}
      },
      "Conflict": {
        "description": "Conflict response for operations that are not returned as batch results",
        "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorEnvelope"}}}
      },
      "TooManyRequests": {
        "description": "Throttle limit exceeded",
        "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorEnvelope"}}}
      },
      "ServiceUnavailable": {
        "description": "Import mutation is temporarily serialized by SQLite",
        "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorEnvelope"}}}
      },
      "InternalError": {
        "description": "Internal server error",
        "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestId"}},
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorEnvelope"}}}
      }
    },
    "schemas": {
      "ErrorEnvelope": {
        "type": "object",
        "required": ["error", "request_id"],
        "properties": {
          "error": {
            "type": "object",
            "required": ["code", "message", "fields"],
            "properties": {
              "code": {"type": "string"},
              "message": {"type": "string"},
              "fields": {"type": ["object", "array", "null"]}
            }
          },
          "request_id": {"type": "string", "format": "uuid"}
        }
      },
      "Device": {
        "type": "object",
        "required": ["uuid", "name", "platform", "default_owner_uuid"],
        "properties": {
          "uuid": {"type": "string", "format": "uuid"},
          "name": {"type": "string", "maxLength": 80},
          "platform": {"type": "string", "enum": ["windows", "ios", "android"]},
          "default_owner_uuid": {"type": "string", "format": "uuid"},
          "last_seen_at": {"type": "string", "format": "date-time"},
          "created_at": {"type": "string", "format": "date-time"},
          "revoked_at": {"type": ["string", "null"], "format": "date-time"}
        }
      },
      "TokenPair": {
        "type": "object",
        "required": ["access_token", "access_expires_at", "refresh_token", "refresh_expires_at", "device"],
        "properties": {
          "access_token": {"type": "string"},
          "access_expires_at": {"type": "string", "format": "date-time"},
          "refresh_token": {"type": "string"},
          "refresh_expires_at": {"type": "string", "format": "date-time"},
          "device": {"$ref": "#/components/schemas/Device"}
        }
      },
      "LoginRequest": {
        "type": "object",
        "required": ["email", "password", "platform", "name"],
        "properties": {
          "email": {"type": "string", "format": "email"},
          "password": {"type": "string", "writeOnly": true},
          "platform": {"type": "string", "enum": ["windows", "ios", "android"]},
          "name": {"type": "string", "maxLength": 80},
          "default_owner_uuid": {
            "type": "string",
            "format": "uuid",
            "description": "Optional. When omitted, the active self owner for the household is selected. Explicit UUIDs remain limited to an active self or spouse owner in the same household."
          }
        },
        "additionalProperties": false
      },
      "Household": {
        "type": "object",
        "required": ["uuid", "name", "created_at", "updated_at"],
        "properties": {
          "uuid": {"type": "string", "format": "uuid"},
          "name": {"type": "string"},
          "created_at": {"type": "string", "format": "date-time"},
          "updated_at": {"type": "string", "format": "date-time"}
        }
      },
      "FinancialOwner": {
        "type": "object",
        "required": ["uuid", "type", "name"],
        "properties": {
          "uuid": {"type": "string", "format": "uuid"},
          "type": {"type": "string", "enum": ["self", "spouse", "shared"]},
          "name": {"type": "string"}
        }
      },
      "SyncEntityBase": {
        "type": "object",
        "required": ["uuid", "version", "created_at", "updated_at", "household_uuid"],
        "properties": {
          "uuid": {"type": "string", "format": "uuid"},
          "version": {"type": "integer", "minimum": 1},
          "created_at": {"type": "string", "format": "date-time"},
          "updated_at": {"type": "string", "format": "date-time"},
          "household_uuid": {"type": "string", "format": "uuid"}
        }
      },
      "Account": {
        "allOf": [
          {"$ref": "#/components/schemas/SyncEntityBase"},
          {
            "type": "object",
            "required": ["financial_owner_uuid", "name", "type", "initial_balance", "currency"],
            "properties": {
              "financial_owner_uuid": {"type": "string", "format": "uuid"},
              "name": {"type": "string"},
              "type": {"type": "string", "enum": ["checking", "savings", "cash", "credit", "investment", "other"]},
              "initial_balance": {"type": "string", "pattern": "^-?[0-9]+\\.[0-9]{2}$"},
              "currency": {"type": "string", "minLength": 3, "maxLength": 3}
            }
          }
        ]
      },
      "Category": {
        "allOf": [
          {"$ref": "#/components/schemas/SyncEntityBase"},
          {
            "type": "object",
            "required": ["name", "type", "color", "icon"],
            "properties": {
              "name": {"type": "string"},
              "type": {"type": "string", "enum": ["income", "expense"]},
              "color": {"type": "string"},
              "icon": {"type": ["string", "null"]}
            }
          }
        ]
      },
      "Transaction": {
        "allOf": [
          {"$ref": "#/components/schemas/SyncEntityBase"},
          {
            "type": "object",
            "required": ["financial_owner_uuid", "account_uuid", "category_uuid", "description", "amount", "date", "type"],
            "properties": {
              "financial_owner_uuid": {"type": "string", "format": "uuid"},
              "account_uuid": {"type": "string", "format": "uuid"},
              "category_uuid": {"type": "string", "format": "uuid"},
              "description": {"type": "string"},
              "amount": {"type": "string", "pattern": "^[0-9]+\\.[0-9]{2}$"},
              "date": {"type": "string", "format": "date"},
              "type": {"type": "string", "enum": ["income", "expense"]}
            }
          }
        ]
      },
      "Summary": {
        "type": "object",
        "required": ["total_balance", "monthly_income", "monthly_expenses"],
        "properties": {
          "total_balance": {"type": "string", "pattern": "^-?[0-9]+\\.[0-9]{2}$"},
          "monthly_income": {"type": "string", "pattern": "^-?[0-9]+\\.[0-9]{2}$"},
          "monthly_expenses": {"type": "string", "pattern": "^-?[0-9]+\\.[0-9]{2}$"}
        }
      },
      "Bootstrap": {
        "type": "object",
        "required": ["household", "owners", "accounts", "categories", "transactions", "summary", "cursor"],
        "properties": {
          "household": {"$ref": "#/components/schemas/Household"},
          "owners": {"type": "array", "items": {"$ref": "#/components/schemas/FinancialOwner"}},
          "accounts": {"type": "array", "items": {"$ref": "#/components/schemas/Account"}},
          "categories": {"type": "array", "items": {"$ref": "#/components/schemas/Category"}},
          "transactions": {"type": "array", "items": {"$ref": "#/components/schemas/Transaction"}},
          "summary": {"$ref": "#/components/schemas/Summary"},
          "cursor": {"type": "string"}
        }
      },
      "PushOperation": {
        "type": "object",
        "required": ["operation_id", "entity", "action", "entity_uuid", "expected_version", "data"],
        "properties": {
          "operation_id": {"type": "string", "format": "uuid"},
          "entity": {"type": "string", "enum": ["account", "category", "transaction"]},
          "action": {"type": "string", "enum": ["create", "update", "delete"]},
          "entity_uuid": {"type": "string", "format": "uuid"},
          "expected_version": {"type": ["integer", "null"], "minimum": 1},
          "data": {"type": "object"}
        },
        "additionalProperties": false
      },
      "PushResult": {
        "type": "object",
        "required": ["status"],
        "properties": {
          "status": {"type": "string", "enum": ["applied", "duplicate", "invalid", "conflict"]},
          "code": {"type": "string", "enum": ["validation_error", "version_conflict", "resource_in_use", "idempotency_conflict"]},
          "fields": {"type": "object"},
          "entity": {
            "oneOf": [
              {"$ref": "#/components/schemas/Account"},
              {"$ref": "#/components/schemas/Category"},
              {"$ref": "#/components/schemas/Transaction"},
              {"$ref": "#/components/schemas/Tombstone"}
            ]
          },
          "submitted": {"type": "object"},
          "current": {
            "oneOf": [
              {"$ref": "#/components/schemas/Account"},
              {"$ref": "#/components/schemas/Category"},
              {"$ref": "#/components/schemas/Transaction"}
            ]
          }
        }
      },
      "Tombstone": {
        "type": "object",
        "required": ["uuid", "deleted"],
        "properties": {
          "uuid": {"type": "string", "format": "uuid"},
          "version": {"type": "integer", "minimum": 2},
          "deleted": {"const": true}
        }
      },
      "SyncChange": {
        "type": "object",
        "required": ["entity_type", "entity_uuid", "entity_version", "operation", "payload"],
        "properties": {
          "entity_type": {"type": "string", "enum": ["account", "category", "transaction"]},
          "entity_uuid": {"type": "string", "format": "uuid"},
          "entity_version": {"type": "integer", "minimum": 1},
          "operation": {"type": "string", "enum": ["create", "update", "delete"]},
          "payload": {
            "oneOf": [
              {"$ref": "#/components/schemas/Account"},
              {"$ref": "#/components/schemas/Category"},
              {"$ref": "#/components/schemas/Transaction"},
              {"$ref": "#/components/schemas/Tombstone"}
            ]
          }
        }
      },
      "ImportBatch": {
        "type": "object",
        "required": ["uuid", "status", "provider", "product_type", "statement_start", "statement_end", "expires_at", "account_uuid", "financial_owner_uuid", "created_count", "duplicate_count", "warning_count", "is_repeated_file"],
        "properties": {
          "uuid": {"type": "string", "format": "uuid"},
          "status": {"type": "string", "enum": ["preview_ready", "needs_account_link", "completed", "failed", "cancelled"]},
          "provider": {"const": "nubank", "description": "Compatibility profile label; it is not proof of institutional origin."},
          "product_type": {"type": "string", "enum": ["bank_account", "credit_card"]},
          "statement_start": {"type": "string", "format": "date"},
          "statement_end": {"type": "string", "format": "date"},
          "expires_at": {"type": "string", "format": "date-time", "description": "Preview is actionable for at most 23 hours."},
          "account_uuid": {"type": ["string", "null"], "format": "uuid"},
          "financial_owner_uuid": {"type": ["string", "null"], "format": "uuid"},
          "created_count": {"type": "integer", "minimum": 0},
          "duplicate_count": {"type": "integer", "minimum": 0},
          "warning_count": {"type": "integer", "minimum": 0},
          "is_repeated_file": {"type": "boolean"}
        },
        "additionalProperties": false
      },
      "DeltaPage": {
        "type": "object",
        "required": ["changes", "cursor"],
        "properties": {
          "changes": {"type": "array", "maxItems": 100, "items": {"$ref": "#/components/schemas/SyncChange"}},
          "cursor": {"type": "string"}
        }
      }
    }
  }
}
