name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    env:
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      SECURE_HSTS_SECONDS: "3600"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
      SECURE_HSTS_PRELOAD: "True"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate ephemeral Django secret
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV" # gitleaks:allow

      - name: Lint
        run: ruff check . --config pyproject.toml

      - name: Django system check
        run: python manage.py check

      - name: Django production security check
        run: python manage.py check --deploy --fail-level WARNING

      - name: Check migrations
        run: python manage.py makemigrations --check

      - name: Tests and deprecation warning gate
        env:
          SECURE_SSL_REDIRECT: "False"
        run: |
          set -o pipefail
          python -Wd manage.py test 2>&1 | tee django-test.log
          if grep -q "DeprecationWarning" django-test.log; then
            echo "DeprecationWarning detected; failing the warning gate."
            exit 1
          fi

      - name: Coverage gate
        env:
          SECURE_SSL_REDIRECT: "False"
        run: |
          coverage erase
          coverage run manage.py test
          coverage report --fail-under=90

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan Git history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
