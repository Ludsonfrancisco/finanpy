name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/sprint-4-flutter-foundation

permissions:
  contents: read

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    env:
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      SECURE_HSTS_SECONDS: "3600"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
      SECURE_HSTS_PRELOAD: "True"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate ephemeral Django secret
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV" # gitleaks:allow

      - name: Lint
        run: ruff check . --config pyproject.toml

      - name: Django system check
        run: python manage.py check

      - name: Django production security check
        run: python manage.py check --deploy --fail-level WARNING

      - name: Check migrations
        run: python manage.py makemigrations --check

      - name: Tests and deprecation warning gate
        env:
          SECURE_SSL_REDIRECT: "False"
        run: |
          set -o pipefail
          python -Wd manage.py test 2>&1 | tee django-test.log
          if grep -q "DeprecationWarning" django-test.log; then
            echo "DeprecationWarning detected; failing the warning gate."
            exit 1
          fi

      - name: Coverage gate
        env:
          SECURE_SSL_REDIRECT: "False"
        run: |
          coverage erase
          coverage run manage.py test
          coverage report --fail-under=90

      - name: Build production image
        run: docker build --tag lar-finance-ci:${{ github.sha }} .

      - name: Verify Supervisor version
        run: test "$(docker run --rm lar-finance-ci:${{ github.sha }} supervisord --version)" = "4.3.0"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan Git history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  flutter_checks:
    name: Flutter format, analyze, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Read pinned Flutter version
        id: flutter-version
        shell: bash
        run: echo "version=$(jq -r '.frameworkVersion' tool/flutter-version.json)" >> "$GITHUB_OUTPUT"
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags=golden

  flutter_windows:
    name: Flutter Windows release and MSIX
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Read pinned Flutter version
        id: flutter-version
        shell: pwsh
        run: |
          $version = (Get-Content tool/flutter-version.json | ConvertFrom-Json).frameworkVersion
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --tags=golden
      - run: flutter test integration_test/auth_sync_home_test.dart -d windows
      - run: flutter build windows --release --dart-define=LAR_FINANCE_API_BASE_URL=https://financeiro.palmbook.online/api/v1
      - run: dart run msix:create --install-certificate false
      - name: Create MSIX SHA-256
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path build -Filter *.msix -Recurse | Select-Object -First 1
          if ($null -eq $msix) { throw "MSIX artifact was not created." }
          $hash = (Get-FileHash -LiteralPath $msix.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($msix.Name)" | Set-Content -Encoding ascii build/msix-sha256.txt
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lar-finance-windows-msix-${{ github.sha }}
          path: |
            mobile/build/**/*.msix
            mobile/build/msix-sha256.txt
          if-no-files-found: error

  flutter_android:
    name: Flutter Android release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Read pinned Flutter version
        id: flutter-version
        shell: bash
        run: echo "version=$(jq -r '.frameworkVersion' tool/flutter-version.json)" >> "$GITHUB_OUTPUT"
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=LAR_FINANCE_API_BASE_URL=https://financeiro.palmbook.online/api/v1
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: lar-finance-android-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  flutter_ios:
    name: Flutter iOS no-codesign build and tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Read pinned Flutter version
        id: flutter-version
        shell: bash
        run: echo "version=$(jq -r '.frameworkVersion' tool/flutter-version.json)" >> "$GITHUB_OUTPUT"
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --exclude-tags=golden
      - run: flutter build ios --release --no-codesign --dart-define=LAR_FINANCE_API_BASE_URL=https://financeiro.palmbook.online/api/v1
