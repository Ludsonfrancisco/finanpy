{% extends "base.html" %}

{% block body %}
<div class="flex h-screen overflow-hidden" x-data="{ sidebarOpen: false }">

  <!-- Mobile overlay -->
  <div
    x-show="sidebarOpen"
    x-transition:enter="transition-opacity ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition-opacity ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click="sidebarOpen = false"
    class="fixed inset-0 z-40 bg-black/75 backdrop-blur-sm md:hidden"
    aria-hidden="true"
  ></div>

  <!-- Sidebar -->
  {% include 'partials/_sidebar.html' %}

  <!-- Main Area (Topbar + Scrollable Main Content) -->
  <div class="flex flex-1 flex-col overflow-hidden min-w-0">

    <!-- Topbar -->
    {% include 'partials/_topbar_app.html' %}

    <!-- Scrollable content -->
    <main id="main-content" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <div class="mx-auto max-w-7xl">

        {% include 'partials/_messages.html' %}

        {% block content %}{% endblock %}

      </div>
    </main>

  </div>
</div>
{% endblock %}
