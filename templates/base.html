<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}Lar Finance{% endblock %}</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- TailwindCSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Alpine.js via CDN — required for mobile sidebar toggle -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Chart.js via CDN for responsive web charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mineral: {
              DEFAULT: '#2F756A',
              light: '#3D9285',
              dark: '#23584F',
            },
            danger: {
              DEFAULT: '#B8534F',
              light: '#D66D69',
              dark: '#963E3B',
            },
            champagne: {
              DEFAULT: '#C7A35A',
              light: '#DBB86F',
              dark: '#A6843D',
            },
            lar: {
              bg: '#121815',
              surface: '#1A221E',
              card: '#1E2823',
              border: '#28352E',
            },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#121815] text-[#E8ECE9] font-sans antialiased">

  <!-- Skip to main content — visible on keyboard focus only -->
  <a href="#main-content"
     class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[9999] focus:rounded-xl focus:bg-emerald-500 focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 focus:ring-offset-slate-950">
    Ir para o conteúdo principal
  </a>

  {% block body %}{% endblock %}

  {% block extra_scripts %}{% endblock %}
</body>
</html>
