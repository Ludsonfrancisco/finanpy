{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}Lar Finance — Gestão Financeira Familiar{% endblock %}</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/design-tokens.css' %}">

  <!-- TailwindCSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Alpine.js via CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            mineral: {
              DEFAULT: 'rgb(from var(--lar-color-mineral) r g b / <alpha-value>)',
              light: 'rgb(from var(--lar-color-mineral-on-dark) r g b / <alpha-value>)',
              dark: 'rgb(from var(--lar-color-mineral-dark) r g b / <alpha-value>)',
              hover: 'rgb(from var(--lar-color-mineral-hover) r g b / <alpha-value>)',
              muted: 'color-mix(in srgb, var(--lar-color-accent-mineral) 15%, transparent)',
            },
            danger: {
              DEFAULT: 'rgb(from var(--lar-color-danger) r g b / <alpha-value>)',
              light: 'rgb(from var(--lar-color-danger-light) r g b / <alpha-value>)',
              dark: 'rgb(from var(--lar-color-danger-dark) r g b / <alpha-value>)',
              muted: 'color-mix(in srgb, var(--lar-color-state-danger) 15%, transparent)',
            },
            champagne: {
              DEFAULT: 'rgb(from var(--lar-color-accent-champagne) r g b / <alpha-value>)',
              light: 'rgb(from var(--lar-color-champagne-light) r g b / <alpha-value>)',
              dark: 'rgb(from var(--lar-color-champagne-dark) r g b / <alpha-value>)',
              muted: 'color-mix(in srgb, var(--lar-color-accent-champagne) 15%, transparent)',
            },
            lar: {
              bg: 'var(--lar-color-surface-canvas)',
              surface: 'var(--lar-color-surface-base)',
              card: 'var(--lar-color-surface-elevated)',
              border: 'var(--lar-color-border-default)',
              borderHover: 'var(--lar-color-border-strong)',
              textPrimary: 'var(--lar-color-text-primary)',
              textSecondary: 'var(--lar-color-text-secondary)',
              textMuted: 'var(--lar-color-text-muted)',
            },
          },
          fontFamily: {
            sans: ['var(--lar-font-family-sans)'],
          },
          boxShadow: {
            'glow-mineral': 'var(--lar-elevation-raised)',
            'glow-danger': 'var(--lar-elevation-raised)',
            'glow-champagne': 'var(--lar-elevation-raised)',
            'card': 'var(--lar-elevation-raised)',
          },
        },
      },
    }
  </script>

  <style>
    /* Custom Scrollbar Casa de Valores */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--lar-color-surface-canvas);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--lar-color-border-default);
      border-radius: var(--lar-radius-sm);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--lar-color-accent-mineral);
    }

    /* Ambient Background */
    .ambient-bg {
      background: var(--lar-color-surface-canvas);
    }

    .lar-card {
      background: var(--lar-color-surface-elevated);
      border: var(--lar-border-default) solid var(--lar-color-border-default);
      box-shadow: var(--lar-elevation-flat);
      transition:
        border-color var(--lar-motion-standard) var(--lar-motion-curve-standard),
        box-shadow var(--lar-motion-standard) var(--lar-motion-curve-standard);
    }
    .lar-card:hover {
      border-color: var(--lar-color-border-strong);
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body class="ambient-bg text-lar-textPrimary font-sans antialiased min-h-screen selection:bg-mineral selection:text-white">

  <!-- Skip to main content -->
  <a href="#main-content"
     class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[9999] focus:rounded-xl focus:bg-mineral focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white focus:outline-none focus:ring-2 focus:ring-mineral-light">
    Ir para o conteúdo principal
  </a>

  {% block body %}{% endblock %}

  {% block extra_scripts %}{% endblock %}
</body>
</html>
