<!-- Topbar Casa de Valores -->
<header class="flex h-16 flex-shrink-0 items-center justify-between border-b border-[#24302A] bg-[#171F1B]/80 px-4 sm:px-6 lg:px-8 backdrop-blur-md z-20">

  <!-- Left: Mobile Toggle & Mobile Logo -->
  <div class="flex items-center gap-3">
    <button
      type="button"
      @click="sidebarOpen = !sidebarOpen"
      class="inline-flex items-center justify-center rounded-xl p-2 text-[#8D958D] transition hover:bg-[#222C27] hover:text-[#E8ECE9] focus:outline-none focus:ring-2 focus:ring-mineral-light md:hidden"
      :aria-expanded="sidebarOpen"
      aria-label="Abrir navegação"
    >
      <svg x-show="!sidebarOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <svg x-show="sidebarOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Mobile Brand -->
    <a href="{% url 'dashboard' %}" class="flex items-center gap-2 text-lg font-bold tracking-tight text-[#E8ECE9] md:hidden">
      <span class="h-7 w-7 rounded-lg bg-mineral flex items-center justify-center text-white text-xs font-bold shadow-sm">LF</span>
      Lar Finance
    </a>

    <!-- Desktop Title / Household Indicator -->
    <div class="hidden md:flex items-center gap-3 text-xs">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-mineral-muted text-mineral-light font-medium border border-mineral/30">
        <span class="h-1.5 w-1.5 rounded-full bg-mineral animate-pulse"></span>
        {{ household.name|default:"Lar Financeiro" }}
      </span>
    </div>
  </div>

  <!-- Right: Actions & User Profile -->
  <div class="flex items-center gap-4">
    <!-- Quick Add Transaction Shortcut -->
    <a href="{% url 'transactions:create' %}" 
       class="hidden sm:inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-mineral hover:bg-mineral-hover text-white text-xs font-bold transition-all shadow-md shadow-mineral/20">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span>Lançar</span>
    </a>

    <!-- User Profile Chip -->
    <a href="{% url 'profiles:edit' %}" class="flex items-center gap-3 p-1.5 rounded-xl hover:bg-[#222C27] transition group">
      {% if request.user.profile.avatar %}
        <img src="{{ request.user.profile.avatar.url }}"
             alt="Foto de perfil"
             class="h-8 w-8 rounded-xl object-cover ring-1 ring-[#24302A] group-hover:ring-mineral-light transition">
      {% else %}
        <div class="flex h-8 w-8 items-center justify-center rounded-xl bg-mineral-muted text-mineral-light text-xs font-bold ring-1 ring-mineral/30">
          {{ request.user.email|first|upper }}
        </div>
      {% endif %}
      <div class="hidden sm:flex flex-col text-left">
        <span class="text-xs font-semibold text-[#E8ECE9] group-hover:text-white transition">
          {{ request.user.first_name|default:request.user.email }}
        </span>
        <span class="text-[10px] text-[#8D958D]">Administrador</span>
      </div>
    </a>
  </div>

</header>
